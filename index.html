<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Luca Bellini</title>
    <meta name="description" content="Luca Bellini, sviluppatore full stack (PHP, JavaScript, MariaDB): gestionali web, domotica con Home Assistant e strumenti di analisi documentale basati su AI.">

    <!-- Anteprima del link su LinkedIn, WhatsApp, Telegram, mail... -->
    <meta property="og:type" content="profile">
    <meta property="og:locale" content="it_IT">
    <meta property="og:title" content="Luca Bellini – Software Developer Full Stack">
    <meta property="og:description" content="Sviluppatore full stack (PHP, JavaScript, MariaDB): gestionali web, domotica con Home Assistant e strumenti AI.">
    <meta property="og:url" content="https://perni24.github.io/sito_curriculum/">
    <meta property="og:image" content="https://perni24.github.io/sito_curriculum/img/anteprima.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Luca Bellini – Software Developer Full Stack">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Icona della scheda e della schermata home -->
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Curriculum vitae</p>
                <h1 id="nome">Caricamento...</h1>
                <p id="titolo" class="role"></p>
                <p id="profilo" class="profile"></p>
            </div>
            <div class="hero-actions">
                <a class="download-btn" href="pdf/curriculum.pdf" download="Luca_Bellini_CV.pdf">Scarica CV (PDF)</a>
                <button id="dark-mode-toggle" type="button" aria-label="Cambia tema">🌙</button>
            </div>
        </header>

        <main class="cv-layout">
            <aside class="sidebar">
                <section id="contatti-section" class="panel">
                    <h2>Contatti</h2>
                    <div id="contatti-list" class="contact-info"></div>
                </section>

                <section id="formazione-section" class="panel">
                    <h2>Formazione</h2>
                    <div id="formazione-list"></div>
                </section>

                <section id="lingue-section" class="panel">
                    <h2>Lingue</h2>
                    <div id="lingue-list" class="contact-info"></div>
                </section>
            </aside>

            <div class="content">
                <section id="esperienze-section" class="panel">
                    <h2>Esperienza professionale</h2>
                    <div id="esperienze-list" class="timeline"></div>
                </section>

                <section id="competenze-section" class="panel">
                    <h2>Competenze tecniche</h2>
                    <div id="competenze-container" class="skills-grid"></div>
                </section>

                <section id="progetti-section" class="panel">
                    <h2>Progetti</h2>
                    <div id="progetti-list" class="timeline"></div>
                </section>

            </div>
        </main>

        <footer>
            <p id="ultimo-aggiornamento"></p>
        </footer>
    </div>

    <script src="script.js?v=20"></script>
</body>
</html>
