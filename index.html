<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Luca Bellini</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="header-content">
                <h1 id="nome">Caricamento...</h1>
                <button id="dark-mode-toggle">🌙</button>
            </div>
                        <p id="titolo"></p>
                    </header>
            
                    <main>
                        <section id="contatti-section" class="collapsible">
                            <div class="collapsible-header">
                                <h2>Contatti</h2>
                                <button class="toggle-btn">−</button>
                            </div>
                            <div class="collapsible-content">
                                <div id="contatti-list" class="contact-info"></div>
                            </div>
                        </section>
            
                        <section id="esperienze-section" class="collapsible">
                            <div class="collapsible-header">
                                <h2>Esperienze Professionali</h2>
                                <button class="toggle-btn">−</button>
                            </div>
                            <div class="collapsible-content">
                                <div id="esperienze-list"></div>
                            </div>
                        </section>
            
                        <section id="competenze-section" class="collapsible">
                            <div class="collapsible-header">
                                <h2>Competenze</h2>
                                <button class="toggle-btn">−</button>
                            </div>
                            <div class="collapsible-content">
                                <div id="competenze-container" class="skills-grid"></div>
                            </div>
                        </section>
            
                        <section id="formazione-section" class="collapsible">
                            <div class="collapsible-header">
                                <h2>Formazione</h2>
                                <button class="toggle-btn">−</button>
                            </div>
                            <div class="collapsible-content">
                                <div id="formazione-list"></div>
                            </div>
                        </section>
                    </main>
            
                    <footer>
            <p id="ultimo-aggiornamento"></p>
            <p>&copy; Luca Bellini. Tutti i diritti riservati.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
