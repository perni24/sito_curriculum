<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae - Luca Bellini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Curriculum vitae</p>
                <h1 id="nome">Caricamento...</h1>
                <p id="titolo" class="role"></p>
                <p id="profilo" class="profile"></p>
            </div>
            <button id="dark-mode-toggle" type="button" aria-label="Cambia tema">🌙</button>
        </header>

        <main class="cv-layout">
            <aside class="sidebar">
                <section id="contatti-section" class="panel">
                    <h2>Contatti</h2>
                    <div id="contatti-list" class="contact-info"></div>
                </section>

                <section id="formazione-section" class="panel">
                    <h2>Formazione</h2>
                    <div id="formazione-list"></div>
                </section>
            </aside>

            <div class="content">
                <section id="esperienze-section" class="panel">
                    <h2>Esperienze professionali</h2>
                    <div id="esperienze-list" class="timeline"></div>
                </section>

                <section id="competenze-section" class="panel">
                    <h2>Competenze</h2>
                    <div id="competenze-container" class="skills-grid"></div>
                </section>

            </div>
        </main>

        <footer>
            <p id="ultimo-aggiornamento"></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
